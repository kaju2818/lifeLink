<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" style="background:#fff; font-family:'Segoe UI',sans-serif;">
  <rect x="220" y="20" width="480" height="560" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="45" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">LifeLink System Boundary</text>

  <!-- Actors Left: Patient & Donor -->
  <!-- Patient/Recipient -->
  <circle cx="80" cy="140" r="15" fill="#3b82f6"/>
  <line x1="80" y1="155" x2="80" y2="195" stroke="#3b82f6" stroke-width="3"/>
  <line x1="55" y1="170" x2="105" y2="170" stroke="#3b82f6" stroke-width="3"/>
  <line x1="80" y1="195" x2="60" y2="235" stroke="#3b82f6" stroke-width="3"/>
  <line x1="80" y1="195" x2="100" y2="235" stroke="#3b82f6" stroke-width="3"/>
  <text x="80" y="255" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Patient / Citizen</text>

  <!-- Donor -->
  <circle cx="80" cy="370" r="15" fill="#ef4444"/>
  <line x1="80" y1="385" x2="80" y2="425" stroke="#ef4444" stroke-width="3"/>
  <line x1="55" y1="400" x2="105" y2="400" stroke="#ef4444" stroke-width="3"/>
  <line x1="80" y1="425" x2="60" y2="465" stroke="#ef4444" stroke-width="3"/>
  <line x1="80" y1="425" x2="100" y2="465" stroke="#ef4444" stroke-width="3"/>
  <text x="80" y="485" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Blood Donor</text>

  <!-- Actors Right: Hospital, Pharmacy, Admin -->
  <!-- Hospital Admin -->
  <circle cx="840" cy="140" r="15" fill="#10b981"/>
  <line x1="840" y1="155" x2="840" y2="195" stroke="#10b981" stroke-width="3"/>
  <line x1="815" y1="170" x2="865" y2="170" stroke="#10b981" stroke-width="3"/>
  <line x1="840" y1="195" x2="820" y2="235" stroke="#10b981" stroke-width="3"/>
  <line x1="840" y1="195" x2="860" y2="235" stroke="#10b981" stroke-width="3"/>
  <text x="840" y="255" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Hospital Admin</text>

  <!-- Pharmacy Admin -->
  <circle cx="840" cy="370" r="15" fill="#f59e0b"/>
  <line x1="840" y1="385" x2="840" y2="425" stroke="#f59e0b" stroke-width="3"/>
  <line x1="815" y1="400" x2="865" y2="400" stroke="#f59e0b" stroke-width="3"/>
  <line x1="840" y1="425" x2="820" y2="465" stroke="#f59e0b" stroke-width="3"/>
  <line x1="840" y1="425" x2="860" y2="465" stroke="#f59e0b" stroke-width="3"/>
  <text x="840" y="485" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Pharmacy Admin</text>

  <!-- Use Cases (Ovals) -->
  <g transform="translate(320, 70)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#1e3a8a" text-anchor="middle">Trigger Emergency SOS</text>
  </g>

  <g transform="translate(320, 130)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#1e3a8a" text-anchor="middle">Search ICU &amp; Oxygen Beds</text>
  </g>

  <g transform="translate(320, 190)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#1e3a8a" text-anchor="middle">Find Blood Donors by Group</text>
  </g>

  <g transform="translate(320, 250)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#1e3a8a" text-anchor="middle">Search &amp; Reserve Medicines</text>
  </g>

  <g transform="translate(320, 310)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#065f46" text-anchor="middle">Update Bed Availability</text>
  </g>

  <g transform="translate(320, 370)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#92400e" text-anchor="middle">Manage Drug Inventory</text>
  </g>

  <g transform="translate(320, 430)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#991b1b" text-anchor="middle">Toggle Donor Availability</text>
  </g>

  <g transform="translate(320, 490)">
    <ellipse cx="140" cy="25" rx="120" ry="22" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="30" font-size="12" fill="#1e293b" text-anchor="middle">Role-Based Authentication</text>
  </g>

  <!-- Association Lines -->
  <!-- Patient connections -->
  <line x1="120" y1="180" x2="320" y2="95" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="320" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="320" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="320" y2="275" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="320" y2="515" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Donor connections -->
  <line x1="120" y1="410" x2="320" y2="455" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="410" x2="320" y2="515" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Hospital connections -->
  <line x1="800" y1="180" x2="600" y2="335" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="800" y1="180" x2="600" y2="515" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Pharmacy connections -->
  <line x1="800" y1="410" x2="600" y2="395" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="800" y1="410" x2="600" y2="515" stroke="#94a3b8" stroke-width="1.5"/>
</svg>