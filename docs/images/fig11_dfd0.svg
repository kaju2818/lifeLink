<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" style="background:#fff; font-family:'Segoe UI',sans-serif;">
  <!-- Process 0 -->
  <circle cx="450" cy="225" r="90" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="215" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">0</text>
  <text x="450" y="235" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">LifeLink Central</text>
  <text x="450" y="255" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Healthcare System</text>

  <!-- Entity: Patient/Citizen -->
  <rect x="50" y="70" width="160" height="60" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="130" y="105" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Patient / Citizen</text>

  <!-- Entity: Blood Donor -->
  <rect x="50" y="320" width="160" height="60" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="130" y="355" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Blood Donor</text>

  <!-- Entity: Hospital Admin -->
  <rect x="690" y="70" width="160" height="60" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="770" y="105" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Hospital Admin</text>

  <!-- Entity: Pharmacy Admin -->
  <rect x="690" y="320" width="160" height="60" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="770" y="355" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Pharmacy Admin</text>

  <!-- Connectors -->
  <!-- Patient to System -->
  <line x1="210" y1="100" x2="380" y2="170" stroke="#475569" stroke-width="1.5"/>
  <text x="270" y="125" font-size="10" fill="#475569">SOS Request, Search Query</text>

  <line x1="380" y1="190" x2="210" y2="120" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="160" font-size="10" fill="#2563eb">Bed status, Donor contact</text>

  <!-- Donor to System -->
  <line x1="210" y1="350" x2="380" y2="280" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="325" font-size="10" fill="#475569">Donor Profile, Availability status</text>

  <!-- Hospital to System -->
  <line x1="690" y1="100" x2="520" y2="170" stroke="#475569" stroke-width="1.5"/>
  <text x="630" y="125" font-size="10" fill="#475569">ICU/Oxygen Bed count</text>

  <!-- Pharmacy to System -->
  <line x1="690" y1="350" x2="520" y2="280" stroke="#475569" stroke-width="1.5"/>
  <text x="630" y="325" font-size="10" fill="#475569">Stock updates, Drug reservations</text>
</svg>