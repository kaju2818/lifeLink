<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520" style="background:#fff; font-family:'Segoe UI',sans-serif;">
  <!-- Class 1: User -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="180" height="150" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="30" fill="#1e3a8a"/>
    <text x="90" y="20" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">User / Profile</text>
    <text x="10" y="50" font-size="11" fill="#334155">- id: string (UUID)</text>
    <text x="10" y="68" font-size="11" fill="#334155">- email: string</text>
    <text x="10" y="86" font-size="11" fill="#334155">- role: Role</text>
    <line x1="0" y1="95" x2="180" y2="95" stroke="#cbd5e1"/>
    <text x="10" y="115" font-size="11" fill="#334155">+ login(creds): bool</text>
    <text x="10" y="133" font-size="11" fill="#334155">+ getSession(): Session</text>
  </g>

  <!-- Class 2: Hospital -->
  <g transform="translate(260, 30)">
    <rect x="0" y="0" width="200" height="170" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="30" fill="#1e3a8a"/>
    <text x="100" y="20" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">Hospital</text>
    <text x="10" y="50" font-size="11" fill="#334155">- id: string</text>
    <text x="10" y="68" font-size="11" fill="#334155">- name: string</text>
    <text x="10" y="86" font-size="11" fill="#334155">- location: GeoPoint</text>
    <text x="10" y="104" font-size="11" fill="#334155">- icuBeds: int</text>
    <text x="10" y="122" font-size="11" fill="#334155">- oxygenBeds: int</text>
    <line x1="0" y1="130" x2="200" y2="130" stroke="#cbd5e1"/>
    <text x="10" y="150" font-size="11" fill="#334155">+ updateBeds(type, count)</text>
  </g>

  <!-- Class 3: BloodDonor -->
  <g transform="translate(510, 30)">
    <rect x="0" y="0" width="190" height="170" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="30" fill="#1e3a8a"/>
    <text x="95" y="20" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">BloodDonor</text>
    <text x="10" y="50" font-size="11" fill="#334155">- donorId: string</text>
    <text x="10" y="68" font-size="11" fill="#334155">- bloodGroup: BloodGroup</text>
    <text x="10" y="86" font-size="11" fill="#334155">- phone: string</text>
    <text x="10" y="104" font-size="11" fill="#334155">- isAvailable: bool</text>
    <text x="10" y="122" font-size="11" fill="#334155">- coordinates: LatLng</text>
    <line x1="0" y1="130" x2="190" y2="130" stroke="#cbd5e1"/>
    <text x="10" y="150" font-size="11" fill="#334155">+ toggleAvailability()</text>
  </g>

  <!-- Class 4: Medicine -->
  <g transform="translate(740, 30)">
    <rect x="0" y="0" width="180" height="170" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="30" fill="#1e3a8a"/>
    <text x="90" y="20" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">Medicine</text>
    <text x="10" y="50" font-size="11" fill="#334155">- medId: string</text>
    <text x="10" y="68" font-size="11" fill="#334155">- name: string</text>
    <text x="10" y="86" font-size="11" fill="#334155">- stockCount: int</text>
    <text x="10" y="104" font-size="11" fill="#334155">- pharmacyName: string</text>
    <text x="10" y="122" font-size="11" fill="#334155">- isRestricted: bool</text>
    <line x1="0" y1="130" x2="180" y2="130" stroke="#cbd5e1"/>
    <text x="10" y="150" font-size="11" fill="#334155">+ reserveUnit(duration)</text>
  </g>

  <!-- Class 5: EmergencyRequest -->
  <g transform="translate(260, 270)">
    <rect x="0" y="0" width="200" height="160" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="30" fill="#b91c1c"/>
    <text x="100" y="20" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">EmergencyRequest</text>
    <text x="10" y="50" font-size="11" fill="#334155">- reqId: string</text>
    <text x="10" y="68" font-size="11" fill="#334155">- triageCategory: string</text>
    <text x="10" y="86" font-size="11" fill="#334155">- userLocation: LatLng</text>
    <text x="10" y="104" font-size="11" fill="#334155">- dispatchedHospitalId</text>
    <line x1="0" y1="115" x2="200" y2="115" stroke="#cbd5e1"/>
    <text x="10" y="135" font-size="11" fill="#334155">+ calculateDistance()</text>
    <text x="10" y="150" font-size="11" fill="#334155">+ dispatchAmbulance()</text>
  </g>

  <!-- Class 6: DispatchEngine -->
  <g transform="translate(510, 270)">
    <rect x="0" y="0" width="200" height="140" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="30" fill="#047857"/>
    <text x="100" y="20" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">DispatchEngine (GIS)</text>
    <text x="10" y="50" font-size="11" fill="#334155">- earthRadiusKm = 6371</text>
    <line x1="0" y1="65" x2="200" y2="65" stroke="#cbd5e1"/>
    <text x="10" y="85" font-size="11" fill="#334155">+ haversine(p1, p2): km</text>
    <text x="10" y="105" font-size="11" fill="#334155">+ rankNearestUnits()</text>
    <text x="10" y="125" font-size="11" fill="#334155">+ filterInRadius(r)</text>
  </g>

  <!-- Connectors -->
  <line x1="360" y1="200" x2="360" y2="270" stroke="#475569" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="370" y="240" font-size="10" fill="#64748b">1..*</text>
  
  <line x1="460" y1="340" x2="510" y2="340" stroke="#475569" stroke-width="1.5"/>
  <text x="475" y="330" font-size="10" fill="#64748b">uses</text>
</svg>